<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta http-equiv="Content-Security-Policy" content="default-src * 'unsafe-inline' 'unsafe-eval' data: blob:;">
  <title>Etarunnel</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <div id="app">
    <!-- Toggle Bar -->
    <div class="toggle-bar">
      <div class="toggle-container">
        <span class="toggle-label">YouTube</span>
        <label class="switch">
          <input type="checkbox" id="modeToggle" />
          <span class="slider"></span>
        </label>
        <span class="toggle-label">Music</span>
      </div>
      <button id="refreshBtn" class="refresh-btn" title="Refresh">
        <svg viewBox="0 0 24 24" width="24" height="24">
          <path fill="currentColor" d="M17.65 6.35A7.958 7.958 0 0012 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08A5.99 5.99 0 0112 18c-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/>
        </svg>
      </button>
    </div>

    <!-- WebView Container (for Capacitor) -->
    <div id="webview-container">
      <iframe id="youtube-frame" src="" frameborder="0" allowfullscreen></iframe>
    </div>
  </div>

  <script type="module" src="/main.js"></script>
  <script type="module" src="/capacitor.js"></script>
</body>
</html>
